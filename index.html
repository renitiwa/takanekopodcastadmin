<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たかねこPodcast - 管理画面</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .admin-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            border-bottom: 2px solid #b538ff;
            padding-bottom: 10px;
            color: #1a0b2e;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            background-color: #b538ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #9d29e6;
        }
        .status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #2a9d8f;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>🎙️ お便り設定 管理画面</h1>
        
        <div class="form-group">
            <label for="statusSelect">お便りの募集状態</label>
            <select id="statusSelect">
                <option value="true">🟢 募集中 (ON)</option>
                <option value="false">🔴 募集終了 (OFF)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="themeInput">現在の募集テーマ</label>
            <textarea id="themeInput" placeholder="テーマを入力してください..."></textarea>
        </div>

        <button id="saveBtn">設定を更新してサイトに反映</button>
        <div id="message" class="status"></div>
    </div>

    <!-- Firebase SDK の読み込み -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // 🚨 【重要】メインサイトと同じFirebase Configをここに貼り付けてください 🚨
const firebaseConfig = {
  apiKey: "AIzaSyBf8wiWgROlJt21DV1xGqRhPthKEF42YH4",
  authDomain: "takanekopodcast.firebaseapp.com",
  databaseURL: "https://takanekopodcast-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "takanekopodcast",
  storageBucket: "takanekopodcast.firebasestorage.app",
  messagingSenderId: "726202760676",
  appId: "1:726202760676:web:bd2471cfd3d65fe1011bf1",
  measurementId: "G-84VDGNNQMM"
};

        // Firebase初期化
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const settingsRef = db.ref('podcastSettings');

        const statusSelect = document.getElementById('statusSelect');
        const themeInput = document.getElementById('themeInput');
        const messageDiv = document.getElementById('message');

        // ページを開いたときに現在の設定を読み込む
        settingsRef.once('value').then((snapshot) => {
            const data = snapshot.val();
            if (data) {
                statusSelect.value = data.isAcceptingLetters ? "true" : "false";
                themeInput.value = data.currentTheme || "";
            }
        });

        // 「更新」ボタンを押したときの処理
        document.getElementById('saveBtn').addEventListener('click', () => {
            const isAccepting = statusSelect.value === "true";
            const themeText = themeInput.value;

            // ボタンを一時的に無効化
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = "更新中...";

            // Firebaseへデータを書き込む
            settingsRef.set({
                isAcceptingLetters: isAccepting,
                currentTheme: themeText
            }).then(() => {
                messageDiv.textContent = "✨ 更新しました！メインサイトに反映されています。";
                setTimeout(() => { messageDiv.textContent = ""; }, 3000);
            }).catch((error) => {
                console.error("更新エラー:", error);
                messageDiv.textContent = "⚠️ エラーが発生しました";
                messageDiv.style.color = "red";
            }).finally(() => {
                btn.disabled = false;
                btn.textContent = "設定を更新してサイトに反映";
            });
        });
    </script>
</body>
</html>
